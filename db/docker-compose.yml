services:
  postgres:
    image: postgres:15-alpine
    container_name: payverify-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payverify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d payverify"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
